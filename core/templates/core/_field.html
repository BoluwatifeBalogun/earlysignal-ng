{% load ui %}<div class="field{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="req" aria-hidden="true">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p class="help" id="help_{{ field.name }}">{{ field.help_text }}</p>{% endif %}
  {% for e in field.errors %}<p class="error" id="error_{{ field.name }}" role="alert">{% icon "alert" 16 %}<span>{{ e }}</span></p>{% endfor %}
</div>
