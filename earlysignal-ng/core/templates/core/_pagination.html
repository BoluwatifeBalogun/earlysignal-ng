{% load ui %}{% if page.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Pages">
  {% if page.has_previous %}<a class="btn btn-ghost btn-sm" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page.previous_page_number }}">{% icon "back" 16 %}Previous</a>{% else %}<span></span>{% endif %}
  <span class="muted">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}<a class="btn btn-ghost btn-sm" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page.next_page_number }}">Next{% icon "arrow" 16 %}</a>{% else %}<span></span>{% endif %}
</nav>{% endif %}
